<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h2>menghitung luas persegi panjang</h2>
    <p></p>

    <script> 
        function hitungLuas(panjang, lebar) {
            return panjang * lebar;
        }
        const luas = hitungLuas(4, 5)
        document.getElementById("hasil").textContent = 
        "Luas persegi panjang = " + luas;


</script>
</body>
