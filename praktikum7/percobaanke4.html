<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>form sapaan</h2>
    <input id="nama" type="text" placeholder="masukan nama">
    <p id="pesan">silahkan isi nama</p>

    <script>
        const inputNama = document.querySelector("#nama");
        const pesan = document.querySelector("#pesan");

        function tampilkanSapaan() {
            const nama = inputNama.value;
            pesan.textContent = nama === "" ?
                "silahkan isi nama" : "halo, " + nama + "!";
        }

        inputNama.addEventListener("input", tampilkanSapaan)
    </script>
</body>
</html>
